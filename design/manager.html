<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>لوحة المدير - إدارة المخزون</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
  <header class="flex items-center justify-between p-4 bg-white dark:bg-gray-800 shadow">
    <div class="flex items-center gap-3">
      <h2 class="text-lg font-semibold">لوحة المدير</h2>
      <span class="text-sm text-gray-500">نظام إدارة المخزون والمبيعات</span>
    </div>
    <div class="flex items-center gap-3">
      <button id="rtlToggle" class="px-3 py-1 bg-gray-100 dark:bg-gray-700 rounded">RTL</button>
      <button id="darkToggle" class="px-3 py-1 bg-gray-100 dark:bg-gray-700 rounded">Dark</button>
      <a href="purchase.html" class="px-3 py-1 bg-blue-600 text-white rounded">طلبات الشراء</a>
      <a href="seller.html" class="px-3 py-1 bg-green-600 text-white rounded">لوحة البائع</a>
    </div>
  </header>

  <main class="p-6 space-y-6">
    <!-- Stats -->
    <section class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow">
        <div class="text-sm text-gray-500">إجمالي المنتجات</div>
        <div id="statProducts" class="text-2xl font-bold mt-2">12</div>
      </div>
      <div class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow">
        <div class="text-sm text-gray-500">إجمالي الكميات المسلمة</div>
        <div id="statQuantities" class="text-2xl font-bold mt-2">420</div>
      </div>
      <div class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow">
        <div class="text-sm text-gray-500">إجمالي المبيعات</div>
        <div id="statSales" class="text-2xl font-bold mt-2">12,340 EGP</div>
      </div>
      <div class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow">
        <div class="text-sm text-gray-500">المخزون المتبقي</div>
        <div id="statRemaining" class="text-2xl font-bold mt-2">210</div>
      </div>
    </section>

    <!-- Actions -->
    <section class="flex justify-between items-center">
      <div class="flex gap-2">
        <input id="searchInput" type="text" placeholder="بحث عن منتج..." class="px-3 py-2 border rounded-md bg-white dark:bg-gray-800" />
        <input id="dateFilter" type="date" class="px-3 py-2 border rounded-md bg-white dark:bg-gray-800" />
      </div>
      <button id="openAddModal" class="px-4 py-2 bg-blue-600 text-white rounded-md">إضافة منتج</button>
    </section>

    <!-- Inventory table -->
    <section>
      <div class="overflow-x-auto bg-white dark:bg-gray-800 rounded-lg shadow">
        <table class="min-w-full text-right">
          <thead class="bg-gray-100 dark:bg-gray-700">
            <tr>
              <th class="px-4 py-3">اسم المنتج</th>
              <th class="px-4 py-3">الكمية المسلمة</th>
              <th class="px-4 py-3">سعر الشراء</th>
              <th class="px-4 py-3">سعر البيع</th>
              <th class="px-4 py-3">تاريخ التسليم</th>
              <th class="px-4 py-3">البائع</th>
              <th class="px-4 py-3">إجراءات</th>
            </tr>
          </thead>
          <tbody id="inventoryBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Add Product Modal -->
  <div id="addModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
    <div class="w-full max-w-lg bg-white dark:bg-gray-800 rounded-lg p-6">
      <h3 class="text-xl font-semibold mb-4">إضافة منتج جديد</h3>
      <form id="addProductForm" class="space-y-3">
        <div>
          <label class="block text-sm text-gray-600">اسم المنتج</label>
          <input name="name" required class="w-full px-3 py-2 border rounded-md bg-gray-50 dark:bg-gray-700 text-right" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm text-gray-600">الكمية المسلمة</label>
            <input name="quantity" type="number" min="1" value="1" required class="w-full px-3 py-2 border rounded-md bg-gray-50 dark:bg-gray-700 text-right" />
          </div>
          <div>
            <label class="block text-sm text-gray-600">سعر الشراء</label>
            <input name="purchasePrice" type="number" step="0.01" required class="w-full px-3 py-2 border rounded-md bg-gray-50 dark:bg-gray-700 text-right" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm text-gray-600">سعر البيع</label>
            <input name="sellingPrice" type="number" step="0.01" required class="w-full px-3 py-2 border rounded-md bg-gray-50 dark:bg-gray-700 text-right" />
          </div>
          <div>
            <label class="block text-sm text-gray-600">التاريخ</label>
            <input name="date" type="date" required class="w-full px-3 py-2 border rounded-md bg-gray-50 dark:bg-gray-700 text-right" />
          </div>
        </div>
        <div>
          <label class="block text-sm text-gray-600">البائع المعين</label>
          <input name="seller" class="w-full px-3 py-2 border rounded-md bg-gray-50 dark:bg-gray-700 text-right" />
        </div>
        <div class="flex gap-2 justify-start">
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">حفظ</button>
          <button type="button" id="closeModal" class="px-4 py-2 bg-gray-200 rounded">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
