<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>لوحة البائع</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
  <header class="p-4 bg-white dark:bg-gray-800 shadow flex items-center justify-between">
    <h2 class="text-lg font-semibold">لوحة البائع</h2>
    <a href="manager.html" class="px-3 py-1 bg-gray-100 rounded">العودة</a>
  </header>

  <main class="p-6 space-y-6">
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="p-4 bg-white dark:bg-gray-800 rounded shadow">
        <div class="text-sm text-gray-500">صندوق النقود الحالي</div>
        <div id="cashBox" class="text-3xl font-bold mt-2">0 EGP</div>
      </div>
      <div class="p-4 bg-white dark:bg-gray-800 rounded shadow">
        <div class="text-sm text-gray-500">إجمالي المبيعات اليوم</div>
        <div id="todaySales" class="text-2xl font-bold mt-2">0 EGP</div>
      </div>
      <div class="p-4 bg-white dark:bg-gray-800 rounded shadow">
        <div class="text-sm text-gray-500">إجمالي المنتجات</div>
        <div id="sellerProductsCount" class="text-2xl font-bold mt-2">0</div>
      </div>
    </section>

    <section>
      <div class="bg-white dark:bg-gray-800 rounded shadow p-4 overflow-x-auto">
        <table class="min-w-full text-right">
          <thead class="bg-gray-100 dark:bg-gray-700">
            <tr>
              <th class="px-4 py-2">اسم المنتج</th>
              <th class="px-4 py-2">المستلم</th>
              <th class="px-4 py-2">المباع</th>
              <th class="px-4 py-2">المتبقي</th>
              <th class="px-4 py-2">سعر البيع</th>
              <th class="px-4 py-2">الإيراد</th>
              <th class="px-4 py-2">إجراء</th>
            </tr>
          </thead>
          <tbody id="sellerBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
