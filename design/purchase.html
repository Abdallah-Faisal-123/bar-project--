<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>طلبات الشراء</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
  <header class="p-4 bg-white dark:bg-gray-800 shadow flex items-center justify-between">
    <h2 class="text-lg font-semibold">طلبات الشراء</h2>
    <a href="manager.html" class="px-3 py-1 bg-gray-100 rounded">العودة</a>
  </header>
  <main class="p-6 space-y-6">
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="p-4 bg-white dark:bg-gray-800 rounded shadow">
        <div class="text-sm text-gray-500">عدد المنتجات</div>
        <div id="poCount" class="text-2xl font-bold mt-2">0</div>
      </div>
      <div class="p-4 bg-white dark:bg-gray-800 rounded shadow">
        <div class="text-sm text-gray-500">إجمالي الكمية</div>
        <div id="poQuantity" class="text-2xl font-bold mt-2">0</div>
      </div>
      <div class="p-4 bg-white dark:bg-gray-800 rounded shadow">
        <div class="text-sm text-gray-500">التكلفة الإجمالية</div>
        <div id="poTotal" class="text-2xl font-bold mt-2">0 EGP</div>
      </div>
    </section>

    <section>
      <div class="bg-white dark:bg-gray-800 rounded shadow p-4">
        <h3 class="font-semibold mb-3">أضف عنصر طلب</h3>
        <form id="poForm" class="grid grid-cols-1 md:grid-cols-4 gap-3">
          <input name="name" placeholder="اسم المنتج" class="px-3 py-2 border rounded bg-gray-50 dark:bg-gray-700 text-right" required>
          <input name="quantity" type="number" min="1" value="1" class="px-3 py-2 border rounded bg-gray-50 dark:bg-gray-700 text-right" required>
          <input name="unitPrice" type="number" step="0.01" value="0" class="px-3 py-2 border rounded bg-gray-50 dark:bg-gray-700 text-right" required>
          <div class="flex gap-2">
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">أضف</button>
            <button type="button" id="clearPo" class="px-4 py-2 bg-gray-200 rounded">مسح</button>
          </div>
        </form>

        <div class="mt-4 overflow-x-auto">
          <table class="min-w-full text-right">
            <thead class="bg-gray-100 dark:bg-gray-700">
              <tr>
                <th class="px-4 py-2">المنتج</th>
                <th class="px-4 py-2">الكمية</th>
                <th class="px-4 py-2">سعر الوحدة</th>
                <th class="px-4 py-2">الإجمالي</th>
                <th class="px-4 py-2">إجراءات</th>
              </tr>
            </thead>
            <tbody id="poBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
