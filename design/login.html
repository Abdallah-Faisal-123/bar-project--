<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تسجيل الدخول - نظام إدارة المخزون</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center font-sans">
  <div class="w-full max-w-md p-8 bg-white dark:bg-gray-800 rounded-lg shadow-lg">
    <h1 class="text-2xl font-semibold text-gray-800 dark:text-gray-100 mb-6 text-center">تسجيل الدخول</h1>
    <form class="space-y-4" id="loginForm">
      <div>
        <label class="block text-sm text-gray-600 dark:text-gray-300">البريد الإلكتروني</label>
        <input type="email" required class="mt-1 w-full px-4 py-2 border rounded-md bg-gray-50 dark:bg-gray-700 text-right" placeholder="name@example.com">
      </div>
      <div>
        <label class="block text-sm text-gray-600 dark:text-gray-300">كلمة المرور</label>
        <input type="password" required class="mt-1 w-full px-4 py-2 border rounded-md bg-gray-50 dark:bg-gray-700 text-right" placeholder="••••••••">
      </div>
      <button type="submit" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md">دخول</button>
    </form>
    <p class="mt-4 text-center text-sm text-gray-500">تجربة التصميم: <a href="manager.html" class="text-blue-600">لوحة المدير</a> • <a href="seller.html" class="text-blue-600">لوحة البائع</a></p>
  </div>
</body>
</html>
